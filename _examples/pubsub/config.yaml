kafka:
  hello:
    brokers: ["127.0.0.1:19092"]
    topics: [topic_hello]
    consumer:
      group_id: consumer_hello
      instances: 3
      session_timeout: 45s
      log_message: true   # kafka 层订阅侧日志（"received kafka message"）
    producer:
      required_acks: -1
      log_message: true   # kafka 层发布侧日志（"sending kafka message"）

# pubsub 段：段级 log_message 是全局收发日志默认值（publish/subscribe 两侧
# 独立，debug 级）；events 按逻辑 topic（业务事件名）配置路由与事件级选项。
# route：显式路由 {transport, key}——transport 是后端标识（示例中 kafka=Kafka
# Transport、memory=内存 Transport）；key 是调用 transport 时使用的主题名，
# 对 kafka 而言必须是 kafka 段配置的逻辑 key（本例 hello→hello）；key 可与
# 逻辑名不同（如 notify→user_notify），用于业务名与后端主题名的解耦。
# route 缺省的事件走自动路由/默认回退。route 同级可继续扩展其他 pubsub 核心
# 配置（log_message/auto_ack/continue_on_error/group/instances/retry）。
pubsub:
  # debug 控制 watermill 核心（router）debug 日志：true 时按应用日志级别
  # 输出；false（缺省）时过滤为 info+，订阅接线等内部日志不刷屏。
  debug: false
  log_message:
    publish: true
    subscribe: true
  events:
    hello:
      route:
        transport: kafka
        key: hello
      # 事件级整体覆盖全局：hello 只记订阅日志（发布侧关闭）。
      log_message:
        subscribe: true
    notify:
      route:
        transport: memory
        key: user_notify

log_level: debug
