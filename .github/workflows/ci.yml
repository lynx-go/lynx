name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: ., flag: core }
          - { module: _examples, flag: examples }
          - { module: contrib/watermill, flag: watermill }
          - { module: contrib/watermill-kafka, flag: watermill-kafka }
          - { module: contrib/telemetry, flag: telemetry }
          - { module: contrib/schedule, flag: schedule }
          - { module: contrib/zap, flag: zap }
          - { module: contrib/registry, flag: registry }
          - { module: contrib/consul, flag: consul }
          - { module: contrib/cluster, flag: cluster }
          - { module: contrib/cluster-redis, flag: cluster-redis }
    steps:
      - uses: actions/checkout@v4

      # 工具链唯一来源：mise.toml（go 1.26.8 / golangci-lint 2.12.2）
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.module }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ matrix.module }}-

      # go.work and go.work.sum are tracked in version control (b95b49a);
      # the checked-out workspace resolves all modules, no re-init needed.

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      # ROADMAP v1.0 标准：CI 强制覆盖率门槛。根与 contrib 模块统一
      # 70% 门槛（实测各模块现状 77%-85%，留有余量），低于则失败。
      - name: Coverage threshold
        working-directory: ${{ matrix.module }}
        if: matrix.flag != 'examples'
        run: |
          cov=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "${{ matrix.flag }} coverage: ${cov}%"
          if awk -v c="$cov" 'BEGIN{exit !(c < 70)}'; then
            echo "coverage ${cov}% is below the 70% threshold"; exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ${{ matrix.module }}/coverage.out
          flags: ${{ matrix.flag }}
          fail_ci_if_error: false

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., _examples, contrib/watermill, contrib/watermill-kafka, contrib/telemetry, contrib/schedule, contrib/zap, contrib/registry, contrib/consul, contrib/cluster, contrib/cluster-redis]
    steps:
      - uses: actions/checkout@v4

      # 工具链唯一来源：mise.toml（go 1.26.8 / golangci-lint 2.12.2）
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.module }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ matrix.module }}-

      - name: golangci-lint
        working-directory: ${{ matrix.module }}
        run: golangci-lint run

  # 依赖漏洞扫描（ROADMAP G4）：govulncheck 只在"符号可达"漏洞时报错，
  # module 级不可达漏洞仅提示。单 job 串行遍历全部模块，与 mise 任务
  # vuln 同源；工具版本钉 v1.8.0（需 go >= 1.26.0，满足 mise 钉版）。
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链唯一来源：mise.toml（go 1.26.8）
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-vuln-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-vuln-

      - name: govulncheck
        run: |
          for module in . _examples contrib/watermill contrib/watermill-kafka contrib/telemetry contrib/schedule contrib/zap contrib/registry contrib/consul contrib/cluster contrib/cluster-redis; do
            echo "::group::govulncheck $module"
            ( cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... )
            echo "::endgroup::"
          done
