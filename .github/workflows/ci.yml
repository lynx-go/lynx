name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: ., flag: core }
          - { module: _examples, flag: examples }
          - { module: contrib/kafka, flag: kafka }
          - { module: contrib/metrics, flag: metrics }
          - { module: contrib/pubsub, flag: pubsub }
          - { module: contrib/schedule, flag: schedule }
          - { module: contrib/zap, flag: zap }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # go.work and go.work.sum are tracked in version control (b95b49a);
      # the checked-out workspace resolves all modules, no re-init needed.

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # ROADMAP v1.0 标准：CI 强制覆盖率门槛。根与 5 个 contrib 模块统一
      # 70% 门槛（实测各模块现状 77%-85%，留有余量），低于则失败。
      - name: Coverage threshold
        working-directory: ${{ matrix.module }}
        if: matrix.flag != 'examples'
        run: |
          cov=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "${{ matrix.flag }} coverage: ${cov}%"
          if awk -v c="$cov" 'BEGIN{exit !(c < 70)}'; then
            echo "coverage ${cov}% is below the 70% threshold"; exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ${{ matrix.module }}/coverage.out
          flags: ${{ matrix.flag }}
          fail_ci_if_error: false

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., _examples, contrib/kafka, contrib/metrics, contrib/pubsub, contrib/schedule, contrib/zap]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8.0
          working-directory: ${{ matrix.module }}
